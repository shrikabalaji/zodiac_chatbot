services:
  app:
    build: ..
    env_file: ../.env
    environment:
      AGENTFORGE_ENV: production
      AGENTFORGE_DATA_DIR: /data
      AGENTFORGE_ALLOWED_HOSTS: ${WORKSHOP_HOST:?Set WORKSHOP_HOST},127.0.0.1,localhost
    volumes:
      - agentforge_data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 150s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2-alpine
    environment:
      WORKSHOP_HOST: ${WORKSHOP_HOST:?Set WORKSHOP_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  agentforge_data:
  caddy_data:
  caddy_config:
