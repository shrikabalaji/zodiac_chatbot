[project]
name = "agentforge-jarvis"
version = "0.1.0"
description = "A Jarvis-inspired LangChain command center for the six LIBA AgentForge agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-google-genai>=4,<5",
  "langchain-ollama>=1,<2",
  "langchain-openai>=1,<2",
  "python-telegram-bot>=21,<23",
  "python-dotenv>=1,<2",
]

[project.scripts]
agentforge-jarvis = "agentforge_jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
